[workspace]
resolver = "3"
members = [
    "crates/greentic-i18n-lib",
    "crates/greentic-i18n",
    "crates/greentic-i18n-cards",
    "crates/greentic-i18n-translator",
]

[workspace.package]
version = "1.1.1"
edition = "2024"

[workspace.dependencies]
assert_cmd = "2"
serde_json = "1"
serde = "1"
blake3 = "1"
data-encoding = "2"
clap = "4"
walkdir = "2"
anyhow = "1"
tempfile = "3"

[workspace.dependencies.greentic-i18n-lib]
version = ">=1.1.1-0, <1.2.0-0"
path = "crates/greentic-i18n-lib"
