name: i18n Translate Bot

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'i18n:translate'
    name: Update translation files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Translate all catalog sets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTH_MODE: api-key
        run: tools/i18n.sh translate

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create translation PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "i18n: update translations"
          title: "i18n: update translations"
          body: |
            Automated translation update via `greentic-i18n-translator`.

            - Trigger: `${{ github.event_name }}`
            - Auth mode: API key
            - Policy: manual overrides preserved by default
          branch: bot/i18n-translate/${{ github.run_id }}-${{ github.run_attempt }}
          delete-branch: false
          labels: i18n, automated

      - name: No-op
        if: steps.changes.outputs.changed == 'false'
        run: echo "No translation diff detected (or i18n baseline missing)."
