name: i18n Validate

on:
  pull_request:
    paths:
      - "crates/greentic-i18n/i18n/**/*.json"
      - "crates/greentic-i18n-translator/i18n/**/*.json"
      - ".i18n/translator-state.json"
      - "crates/greentic-i18n-translator/**"
      - "tools/i18n.sh"
      - ".github/workflows/i18n_validate.yml"
      - ".github/workflows/i18n_translate_bot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate i18n invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Detect change groups
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            i18n_any:
              - "crates/greentic-i18n/i18n/**/*.json"
              - "crates/greentic-i18n-translator/i18n/**/*.json"
            staleness:
              - "crates/greentic-i18n/i18n/en.json"
              - "crates/greentic-i18n-translator/i18n/en.json"
              - ".i18n/translator-state.json"

      - name: Validate translations
        if: steps.changes.outputs.i18n_any == 'true'
        run: tools/i18n.sh validate

      - name: Staleness check (when en/state changed)
        if: steps.changes.outputs.staleness == 'true'
        run: tools/i18n.sh status
