name: Nightly Coverage

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    with:
      run-semver-checks: false

  coverage:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install coverage tools
        # Authenticate binstall so it uses the GitHub API without hitting the
        # unauthenticated rate limit (403). Without a token, binstall falls back
        # to building from source, and `cargo install cargo-nextest` without
        # --locked is hard-rejected by nextest's locked-tripwire crate.
        #
        # `--disable-strategies compile` makes that fallback impossible: on a 403
        # (or any other API hiccup) binstall silently degrades to a source build
        # instead of erroring, which burns ~11 minutes of pointless compilation
        # and hides the real cause. All three tools publish prebuilt binaries, so
        # failing loudly is strictly better. The `command -v` checks assert the
        # binaries really landed on PATH before the coverage step depends on them.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall --no-confirm --locked --disable-strategies compile \
            greentic-dev cargo-nextest cargo-llvm-cov
          command -v greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov

      - name: Enforce coverage policy
        run: greentic-dev coverage
