name: Perf (lightweight)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run perf guard tests
        run: cargo test -p greentic-i18n-lib --test perf_scaling --test perf_timeout

      - name: Run benchmark smoke
        run: cargo bench -p greentic-i18n-lib --bench perf -- --sample-size 10
