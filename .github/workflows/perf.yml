name: Perf (lightweight)
# Nightly-only. See plans/binary-bifurcation.md Phase A.8: push-trigger removed
# because post-merge perf runs were burning 15+ min without actionable signal.

on:
  schedule:
    - cron: "34 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run perf guard tests
        run: cargo test -p greentic-i18n-lib --test perf_scaling --test perf_timeout

      - name: Run benchmark smoke
        run: cargo bench -p greentic-i18n-lib --bench perf -- --sample-size 10
